name: QA Swarm

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: The number of a pull request to post the report on
        type: string
        default: ''

jobs:
  fingerprint:
    type: fingerprint
    environment: preview

  get_build_ios:
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      profile: agent
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build_ios:
    type: build
    needs: [get_build_ios]
    if: ${{ !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: agent

  repack_ios:
    type: repack
    needs: [get_build_ios]
    if: ${{ needs.get_build_ios.outputs.build_id }}
    params:
      build_id: ${{ needs.get_build_ios.outputs.build_id }}
      profile: agent

  lane_ios_launch:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: launch
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-launch-evidence
          path: agent-output/evidence/**/*

  lane_ios_sign_in:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: sign-in
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-sign-in-evidence
          path: agent-output/evidence/**/*

  lane_ios_email_check:
    needs: [get_build_ios]
    after: [build_ios, repack_ios]
    environment: preview
    env:
      BUILD_ID: ${{ after.build_ios.outputs.build_id || after.repack_ios.outputs.build_id }}
      PLATFORM: ios
      FLOW: email-check
    outputs:
      verdict: ${{ steps.lane.outputs.verdict }}
      site_url: ${{ steps.lane.outputs.site_url }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: lane
        run: bash .eas/agents/qa-lane.sh
      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: qa-ios-email-check-evidence
          path: agent-output/evidence/**/*

  report:
    type: doc
    after: [lane_ios_launch, lane_ios_sign_in, lane_ios_email_check]
    params:
      md: |
        # QA Swarm report

        - **iOS, launch:** ${{ after.lane_ios_launch.outputs.verdict || 'FAIL: The lane did not finish.' }} [Evidence site](${{ after.lane_ios_launch.outputs.site_url }})
        - **iOS, sign-in:** ${{ after.lane_ios_sign_in.outputs.verdict || 'FAIL: The lane did not finish.' }} [Evidence site](${{ after.lane_ios_sign_in.outputs.site_url }})
        - **iOS, email check:** ${{ after.lane_ios_email_check.outputs.verdict || 'FAIL: The lane did not finish.' }} [Evidence site](${{ after.lane_ios_email_check.outputs.site_url }})
